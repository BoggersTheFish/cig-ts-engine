[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cig-ts-engine"
version = "0.1.0"
description = "Deterministic Concept/Constraint Intelligence Graph and Thinking System engine skeleton."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pydantic",
  "pyyaml",
  "typer",
  "matplotlib",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
cig = "cig.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
